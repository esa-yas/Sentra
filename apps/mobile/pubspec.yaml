name: sentra_app
description: Sentra — stops scam payments before the money leaves, and lets someone you trust help.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  # Real authentication, and the browser handoff a bank redirect needs.
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  # Receives the bank's redirect back into the app.
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
