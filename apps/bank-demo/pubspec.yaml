name: sentra_bank_demo
description: >-
  A demo bank app for showing Sentra end to end. Based on the open-source Flutter banking template
  by Martin Yovo (github.com/martinoyovo/flutter-banking-app), MIT-licensed; migrated to Dart 3
  and wired to real balances, a local database, and the Sentra SDK at the transfer screen.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  # Real scam protection at the transfer screen.
  sentra_sdk:
    path: ../../packages/sentra_sdk
  # The bank's own auth for the connect step, and the deep link Sentra opens it with.
  local_auth: ^2.3.0
  app_links: ^6.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/memoji/
    - assets/cards/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_Regular.ttf
        - asset: assets/fonts/DMSans_Medium.ttf
        - asset: assets/fonts/DMSans_Bold.ttf
    - family: IconlyBold
      fonts:
        - asset: assets/fonts/Iconly_Bold.ttf
    - family: IconlyBroken
      fonts:
        - asset: assets/fonts/Iconly_Light.ttf
